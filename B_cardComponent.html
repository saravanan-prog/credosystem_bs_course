<html>

<head>
    <title>BS Cards </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="container d-flex gap-3">
        <div class="card w-25">
            <div class="card-header">
                <img src="./Images/collegeLogo.jpg" alt=""  class="card-img-top img-fluid img-fit" style="height: 200px; object-fit: contain;">
            </div>
            <div class="card-body">
                <div class="h4 text-center">Tower toy </div>
                <div class=" text-center">Rs.1000</div>
            </div>
            <div class="card-footer">
                <button class="btn btn-primary ms-5">Buy Now</button>
            </div>
        </div>

        <div class="card w-25">
            <div class="card-header ">
                <img src="./Images/ajith1.jpg" alt=""  style="height: 200px; object-fit: cover;" />
            </div>
            <div class="card-body">
                <div class="h4 text-center">Tower toy </div>
                <div class=" text-center">Rs.1000</div>
            </div>
            <div class="card-footer">
                <button class="btn btn-primary ms-5">Buy Now</button>
            </div>
        </div>
    </div>
