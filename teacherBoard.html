<html>

<head>
    <title>Bootstrap Toggle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Collapse -->
     <div class="container">
        <button 
            class = "btn btn-primary mt-2"
            data-bs-toggle = "collapse"
            data-bs-target = "#my-content"

        > 
            Show / Hide content 
        </button>
     </div>

     <div class="container mt-5 collapse" id="my-content">
         <p> Hello welcome to Bootstrap world </p>
     </div>

    <!--Modal workout -->

     <button 
        class = "btn btn-danger mt-5"
        data-bs-toggle = "modal"
        data-bs-target = "#my-modal"
     > Open model </button>


    <div class="modal" id="my-modal">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="modal-title h3"> Login Form </div>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p> Welcome to Bs world </p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary">submit</button>
                    <button class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
     </div>
















  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
