    <div
      id="cinemaCarousel"
      class="carousel slide w-50 mx-auto"
      data-bs-ride="carousel"
    >
      <!-- Cinema Names -->
      <div class="carousel-inner text-center border rounded p-3">
        <div class="carousel-item active"><h5>Rohini Silver Screens</h5></div>
        <div class="carousel-item"><h5>PVR Cinemas</h5></div>
        <div class="carousel-item"><h5>AGS Cinemas</h5></div>
        <div class="carousel-item"><h5>Kamala Cinemas</h5></div>
      </div>
      <!-- Previous -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#cinemaCarousel"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon bg-dark"></span>
      </button>
      <!-- Next -->
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#cinemaCarousel"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon bg-dark"></span>
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
