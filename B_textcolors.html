<html>
    <head>
        <title>BootStrap Tutorial - text Color Property </title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap JS CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <!--Text colors -->
        <div class="container">
            <div class="h1 text-primary">Hello welcome to Bs world</div>
            <div class="h2 text-info"> Hello welcome to Bs world</div>
            <div class="h3 text-warning">Hello welcome to Bs world</div>
            <div class="h4 text-dark">Hello welcome to Bs world</div>
            <div class="h5 text-primary">Hello welcome to Bs world</div>
        </div>
    </body>
</html>
