<html>
    <head>
        <title>BootStrap Tutorial -Color Property </title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        
    </head>
    <body>
        <!--Background colors -->
        <div class="container">
            <div class="h1 bg-primary ">Hello welcome to Bs world</div>
            <div class="h2 bg-success ">Hello welcome to Bs world</div>
            <div class="h3 bg-warning">Hello welcome to Bs world</div>
            <div class="h4 bg-dark">Hello welcome to Bs world</div>
            <div class="h5 bg-muted">Hello welcome to Bs world</div>
            <div class="h6 bg-info">Hello welcome to Bs world</div>
        </div>



        <!-- Bootstrap JS CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>  
    </body>
</html>
