<html>

<head>
    <title>Bootstrap coursel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div  id="myCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../Images/ajith1.jpg" alt="" class="d-block w-100 h-50" >
            </div>
            <div class="carousel-item">
                 <img src="../Images/ajith2.jpg" alt="" class="d-block w-100 h-50">
            </div>
            <div class="carousel-item">
                 <img src="../Images/collegeLogo.jpg" alt="" class="d-block w-100 h-50">
            </div>
        </div>
        <button class="carousel-control-prev" data-bs-target="#myCarousel" data-bs-slide="prev">Prev</button>
        <button class="carousel-control-next" data-bs-target="#myCarousel" data-bs-slide="next">Next</button>
    </div>


</body>
</html>
