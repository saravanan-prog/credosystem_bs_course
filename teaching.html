<html>

<head>
    <title>BS forms </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div class="h1 text-center text-white bg-success p-3">
        Baisc Login Form Creation
    </div>
    <form>
        <div class="container">
            <div>
                <label for="username" class="form-label">Email <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div>
                <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" name="password">
            </div>

            <div>
                <label for="gender" class="form-label">Gender</label>

                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-control" name="gender" id="gender">
                    <label for="" class="form-check-label">male</label>
                </div>

                <div class="form-check form-check-inline">
                    <input type="radio" class="form-check-control" name="gender" id="gender">
                    <label for="" class="form-check-label">female</label>
                </div>

            </div>


            <div>
                <button type="submit" class="btn btn-primary mt-3">Login</button>
                <button type="button" class="btn btn-danger mt-3">cancel</button>
            </div>



        </div>
    </form>


</body>

</html>
