<html>
<head>
    <title>BS forms </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <div class="text-center h2"> Basic Form Understand</div>

    <div class="container mt-3">
        <form>

            <div>
                <label class="form-label"> Canidate Name </label>
                <input type="text" class="form-control" required>
            </div>

            <div class="input-group mt-3">
                <label class="input-group-text">@</label>
                <input type="text" class="form-control" placeholder="xyz@gmail.com">
            </div>

            <div class="input-group mt-3">
                <label for="" class="input-group-text">$</label>
                <input type="text" class="form-control">
            </div>


            <div class="mt-3">
                <label class="form-label">Gender</label>
                <div class="form-check-inline">
                    <input type="radio" name="gender" value="male" class="form-check-input ms-3">
                    <label class="form-check-label ">Male</label>
                </div>
                <div class="form-check-inline">
                    <input type="radio" name="gender" value="female" class="form-check-input">
                    <label class="form-check-label">female</label>
                </div>
            </div>



            <div class="mt-3">
                <label class="form-label">Language</label>

                <div class="form-check-inline">
                    <input type="checkbox" class="form-check-input ms-3">
                    <label class="form-check-label">Tamil</label>
                </div>
                <div class="form-check-inline">
                    <input type="checkbox" class="form-check-input">
                    <label class="form-check-label">English</label>
                </div>

            </div>

            <div class="mt-3">
                <label  class="form-label">Choose Your Country</label>
                <select name="country" id="country" class="form-select">
                    <option value="">choose country</option>
                    <option value="india">India</option>
                    <option value="china">China</option>
                    <option value="singapore">Singapore</option>
                </select>
            </div>

            

        

            <div class="mt-5">
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>



        </form>
    </div>
<!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
