<html>

<head>
    <title>Bootstrap Toggle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    
</head>
<body>

     <div class="container  m-5">
        <div>
            <button class="btn btn-primary"
                data-bs-toggle = "collapse"
                data-bs-target = "#my-content"
            > click me </button>
        </div>

        <div class="collapse m-3 p-3 bg-success text-white" id="my-content">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quidem dolorum aspernatur facilis quam cupiditate earum ducimus, asperiores quis minus enim! Blanditiis veritatis quibusdam soluta fugiat magni. Accusantium animi sequi est.</p>
        </div>

     </div>

     <div class="container  m-5">
    

    <div class="dropdown">
      
        <button class="btn btn-info"
            data-bs-toggle = "dropdown"
            data-bs-target = "#my-content"
            >courses</button>
      
           
            <div class="dropdown-menu" id="menu-content">
                <nav class="navbar">
                    <ul class="navbar-nav ms-3">
                        <li class="nav-item"><a  class="nav-link" href="#">Angular</a></li>
                        <li class="nav-item"><a  class="nav-link" href="#">React</a></li>
                        <li class="nav-item"><a  class="nav-link" href="#">Nest Js</a></li>
                    </ul>
                    
                </nav>
            </div>
    </div>




    <div class="container  m-5">


        <button 
          class="btn btn-info p-3"
          data-bs-toggle = "modal"
          data-bs-target = "#myModel"
        >show model</button>


        <div class="modal" id="myModel">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">Hi i am saravanan</div>
                    <div class="modal-footer"></div>
                </div>
            </div>
        </div>


    </div>

    



     </div>

   


    


   

</body>
</html>
