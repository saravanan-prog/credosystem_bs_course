<html>

<head>
    <title>Bootstrap Toggle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    
</head>
<body>

    <!-- collpase = hide and show -->

    <div class="container-fluid">
        <button
           class="btn btn-primary"
           data-bs-toggle="collapse"
           data-bs-target="#my-content"
        > press me</button>
    </div>

    <div class="container " >
        <p class="collapse" id="my-content">Lorem ipsum dolor sit amet consectetur adipisicing elit. A similique aperiam iure sit earum harum esse. Nemo incidunt recusandae nesciunt rem dignissimos, et voluptatibus voluptatum laudantium, molestias officiis, enim cupiditate?</p>
    </div>

    <!-- Modal -->

     <div class="cotainer">
        <button
          class="btn btn-success mt-3"
          data-bs-toggle="modal"
          data-bs-target="#my-dial-box"
        >open modal</button>
     </div>

     <div class="container">
        <div class="modal" id="my-dial-box">
            <div class="modal-dialog">
               <div class="modal-content">
                      <div class="modal-header">
                        <button 
                            class="btn-close"
                            data-bs-dismiss="modal"
                        ></button>
                      </div>
                      <div class="modal-body">Hello Saravanan</div>
                    <div class="modal-footer"></div>
               </div>
            </div>
        </div>
     </div>

   

</body>
</html>
