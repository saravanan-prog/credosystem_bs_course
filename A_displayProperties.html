<html>

<head>
    <title>BS Display Props </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!--d-none -->
    <div class="container-fluid d-none">
        <div class="h1">Saravanan</div>
        <div class="h2">Ranjith</div>
        <div class="h3">Hari</div>
    </div>
    

    <!-- block to inline-->


    <div class="container-fluid ">
        <div class="h1 d-inline">Saravanan</div>
        <div class="h2 d-inline">Ranjith</div>
        <div class="h3 d-inline">Hari</div>
    </div>


      <!-- block to inline-block-->


    <div class="container-fluid ">
        <div class="h1 d-inline-block">Gopal</div>
        <div class="h2 d-inline-block">Kacha</div>
        <div class="h3 d-inline-block">satheesh</div>
    </div>

</body>
</html>
