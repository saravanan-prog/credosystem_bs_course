<html>

<head>
    <title>BS Display Props </title>
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <!--d-none -->
    <div class="container-fluid border border-danger">
        <div class="h1">Saravanan</div>
        <div class="h2 d-none">Ranjith</div>
        <div class="h3">Hari</div>
    </div>
    

    <!-- block to inline-block-->


    <div class="container-fluid border border-primary mt-5">
        <div class="h1 d-inline bg-warning">Ramesh</div>
        <div class="h2 d-inline bg-success">Suresh</div>
        <div class="h3 d-inline bg-primary">Rajesh</div>
    </div>

    

    <div class="container-fluid border border-primary mt-5">
        <div class="h1 d-inline-block bg-warning">Ravi</div>
        <div class="h2 d-inline-block bg-success">Bavi</div>
        <div class="h3 d-inline-block bg-primary">kavi</div>
    </div>




</body>
</html>
