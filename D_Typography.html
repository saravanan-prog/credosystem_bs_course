<html>
    <head>
        <title>BootStrap Tutorial -Display Text Property </title>
        <!-- Bootstrap CSS CDN -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap JS CDN -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
       <div class="container-fluid bg-primary text-white text-center">
            <p class="title h3">Text Alignment</p>
       </div>

       <div class="container ">
            <div class="text-start">Text 1 From Starting Edge</div>
            <div class="text-center">Text 2 starting Center</div>
            <div class="text-end">Text3 starting end side</div>
       </div>


       <div class="container-fluid bg-primary text-white">
            <p class="title h3">Font weight Styles</p>
       </div>

       <div class="container ">
            <div class="fw-normal">Normal font</div>
            <div class="fw-bold">Bold font </div>
            <div class="fst-italic">Italic font</div>
            <div class="fw-light ">light font</div>
       </div>


        <div class="container-fluid bg-primary text-white">
            <p class="title h3">Font size</p>
       </div>

       <div class="container">
            <div class="fs-0">font level 0 </div>
            <div class="fs-1">font level 1 </div>
            <div class="fs-2">font level 2</div>
            <div class="fs-3">font level 3</div>
            <div class="fs-4">font level 4</div>
            <div class="fs-5">font level 5</div>
       </div>

    </body>
</html>
