<html>
  <head>
    <title>Bootstrap carausel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
   
  </head>

  <body>
    <!-- carousel start -->

    <div
      id="myCarousel"
      class="carousel slide"
      data-bs-ride="carousel"
      data-bs-interval="2000"
    >
      <div class="carousel-inner">
        <!-- First Slide -->
        <div class="carousel-item active">
          <img src="./asserts/Images/ajith1.jpg" class="d-block w-100" />
        </div>

        <!-- Second Slide -->
        <div class="carousel-item">
          <img src="./asserts/Images/ajith2.jpg" class="d-block w-100" />
        </div>
        <!-- Third Slide -->
        <div class="carousel-item">
          <img src="./asserts/Images/collegeLogo.jpg" class="d-block w-100" />
        </div>
      </div>

      <!-- Previous Button -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#myCarousel"
        data-bs-slide="prev"
      >
        Prev
      </button>

      <!-- Next Button -->
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#myCarousel"
        data-bs-slide="next"
      >
        Next
      </button>
    </div>

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
